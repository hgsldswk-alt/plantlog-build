name: PlantLog
options:
  deploymentTarget:
    iOS: '17.0'
  developmentLanguage: zh-Hans
  knownRegions: [zh-Hans, en, zh-Hant, ja, ko, de, es, fr, pt-BR, it, nl]
settings:
  base:
    APP_ID: com.hgsldswk.plantlog
    APP_STORE_ID: '6836773816'
    MARKETING_VERSION: "1.0.3"
    CURRENT_PROJECT_VERSION: '1'
    SWIFT_VERSION: '5.0'
    CODE_SIGN_STYLE: Automatic
targets:
  PlantLog:
    type: application
    platform: iOS
    sources:
      - path: PlantLog
      - path: Shared
      - path: PlantLogFixtures
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_ID)
        TARGETED_DEVICE_FAMILY: '1'
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Release:
          EXCLUDED_SOURCE_FILE_NAMES: 'demo-*.jpg'
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: PlantLog AppStore
    info:
      path: PlantLog/Info.plist
      properties:
        CFBundleDisplayName: PlantLog
        CFBundleDevelopmentRegion: zh-Hans
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        APP_STORE_ID: $(APP_STORE_ID)
        PlantProProductID: $(APP_ID).pro
        PlantTrialProductID: $(APP_ID).trial
        CFBundleDocumentTypes:
          - CFBundleTypeName: Plant Care Settings
            CFBundleTypeRole: Viewer
            LSHandlerRank: Owner
            LSItemContentTypes: [com.hgsldswk.plantlog.plantcare]
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.hgsldswk.plantlog.plantcare
            UTTypeDescription: Plant Care Settings
            UTTypeConformsTo: [public.json, public.content]
            UTTypeTagSpecification:
              public.filename-extension: [plantcare]
              public.mime-type: [application/vnd.plantlog.plantcare+json]
        LSSupportsOpeningDocumentsInPlace: true
  PlantLogTests:
    type: bundle.unit-test
    platform: iOS
    sources: [PlantLogTests, Shared, PlantLog/PlantStore.swift]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_ID).tests
        GENERATE_INFOPLIST_FILE: YES
  PlantLogUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [PlantLogUITests]
    dependencies:
      - target: PlantLog
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_ID).uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: PlantLog
schemes:
  PlantLog:
    build:
      targets:
        PlantLog: all
        PlantLogTests: [test]
    test:
      config: Debug
      targets: [PlantLogTests]
  PlantLogUI:
    build:
      targets:
        PlantLog: all
        PlantLogUITests: [test]
    test:
      config: Debug
      targets: [PlantLogUITests]
